<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Log!t Companion - Ultra-fast movie capture." />
    <meta name="theme-color" content="#000000" />
    <title>Log!t Companion · Quick Capture</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/companion.css?v=59" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ></script>
  </head>
  <body>
    <div class="companionContainer">
      <!-- HEADER -->
      <header class="companionHeader">
        <div class="logoRow">
          <a href="index.html" class="logoText">Log!t</a>
          <span class="companionBadge">Companion</span>
        </div>
        <div class="headerNavLinks">
          <a href="pending.html" class="navLink" id="headerPendingLink">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            Pending
            <span class="previewCountBadge pendingBadge" style="display: none;"></span>
          </a>
          <a href="index.html" class="navLink" title="Main Library">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
            Library
          </a>
        </div>
      </header>

      <!-- CAPTURE INPUT SECTION -->
      <section class="captureSection">
        <div class="captureInputWrap">
          <textarea
            id="captureInput"
            class="captureTextarea"
            placeholder="Type or paste movies, e.g.:
Interstellar 5/5 yesterday
The Prestige 4.5
Dune Part Two
Arrival tomorrow"
            aria-label="Capture movies input"
            rows="4"
          ></textarea>

          <div class="inputToolBar">
            <div class="toolbarBtns">
              <button type="button" class="toolBtn" id="pasteBtn" title="Paste from clipboard">
                <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
                Paste
              </button>
              <button type="button" class="toolBtn clear" id="clearBtn" title="Clear input">
                Clear
              </button>
            </div>

            <!-- Quick helper chips -->
            <div class="quickPills">
              <span class="quickPill" data-insert="yesterday">yesterday</span>
              <span class="quickPill" data-insert="today">today</span>
              <span class="quickPill" data-insert="5/5">5/5</span>
              <span class="quickPill" data-insert="4.5">4.5</span>
              <span class="quickPill" data-insert="rewatch">rewatch</span>
            </div>
          </div>
        </div>
      </section>

      <!-- LIVE PREVIEW SECTION -->
      <section class="previewSection">
        <div class="previewHeader">
          <div class="previewTitle">
            Live Preview
            <span class="previewCountBadge" id="previewCount">0</span>
          </div>
        </div>
        <div class="previewList" id="previewList"></div>
      </section>

      <!-- FIXED BOTTOM ACTION BAR -->
      <div class="companionActionBar">
        <div class="actionInner">
          <button type="button" class="sendBtn" id="sendBtn" disabled>
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            Send to Log!t Pending
          </button>
        </div>
        <div class="syncStatus">
          <span class="syncDot" id="syncDot"></span>
          <span id="syncText">Checking sync status...</span>
        </div>
      </div>

      <!-- SUCCESS MODAL OVERLAY -->
      <div class="toastOverlay" id="successToast" role="dialog" aria-modal="true">
        <div class="toastModal">
          <div class="toastIcon">
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
          </div>
          <h3 class="toastTitle">Queued to Pending!</h3>
          <p class="toastSubtitle">
            <span id="toastCount">0</span> movie(s) sent to your Log!t account. Complete and log them in your library anytime.
          </p>
          <div class="toastActions">
            <button type="button" class="toastPrimaryBtn" id="toastPendingBtn">View in Pending &rarr;</button>
            <button type="button" class="toastSecondaryBtn" id="toastMoreBtn">Capture More</button>
          </div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script defer src="js/constants.js?v=59"></script>
    <script defer src="js/config.js?v=59"></script>
    <script defer src="js/utils.js?v=59"></script>
    <script defer src="js/search.js?v=59"></script>
    <script defer src="js/movieFactory.js?v=59"></script>
    <script defer src="js/movies.js?v=59"></script>
    <script defer src="js/supabase.js?v=59"></script>
    <script defer src="js/storage.js?v=59"></script>
    <script defer src="js/auth.js?v=59"></script>
    <script defer src="js/parser.js?v=59"></script>
    <script defer src="js/pending.js?v=59"></script>
    <script defer src="js/companion.js?v=59"></script>
  </body>
</html>
