<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="description" content="Log!t - Pending movies queue." />
    <title>Log!t - Pending</title>
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="assets/images/favicon-32x32.png"
    />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css?v=59" />
    <link rel="stylesheet" href="css/components.css?v=59" />
    <link rel="stylesheet" href="css/modal.css?v=59" />
    <link rel="stylesheet" href="css/desktop.css?v=59" />
    <link rel="stylesheet" href="css/animations.css?v=59" />
    <link rel="stylesheet" href="css/pending.css?v=59" />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"
    ></script>
  </head>
  <body>
    <!-- HEADER -->
    <header class="header" id="header">
      <div class="headerRow">
        <div style="display: flex; align-items: center; gap: 10px; flex: 1">
          <a href="index.html" class="logo">Log!t</a>
        </div>
        <div class="pcHeaderNav">
          <button class="pcNavBtn" onclick="Logit.Utils.navTo('index.html')">
            Library
          </button>
          <button
            class="pcNavBtn"
            onclick="window.location.href = Logit.Utils.getPageUrl('index.html') + '?add=true'"
          >
            Add Movie
          </button>
          <button
            class="pcNavBtn active"
            onclick="Logit.Utils.navTo('pending.html')"
          >
            Pending
            <span class="listBadge pendingBadge" data-badge="pending" style="display: none;"></span>
          </button>
          <button class="pcNavBtn" onclick="Logit.Utils.navTo('stats.html')">
            Stats
          </button>
        </div>
        <div style="display: flex; gap: 6px; align-items: center">
          <button
            class="settingsIcon"
            id="profileBtn"
            title="Profile"
            onclick="Logit.Utils.navTo('profile.html')"
            aria-label="Profile"
          >
            <svg
              width="18"
              height="18"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              viewBox="0 0 24 24"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- MAIN PENDING CONTAINER -->
    <main class="pendingContainer">
      <div class="pendingHeaderRow">
        <div class="pendingTitleWrap">
          <h1 class="pendingPageTitle">Pending Movies</h1>
          <span class="pendingCountPill" id="pendingCountPill">0</span>
        </div>
        <div class="pendingHeaderActions">
          <button
            class="iconOnlyBtn"
            id="refreshPendingBtn"
            title="Refresh pending movies"
            aria-label="Refresh"
          >
            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
          </button>
          <a
            href="companion.html"
            class="quickCaptureBtn"
            title="Open Quick Capture"
          >
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            Quick Capture
          </a>
        </div>
      </div>

      <!-- PENDING GRID -->
      <section class="pendingGrid" id="pendingGrid"></section>
    </main>

    <!-- BOTTOM NAV FOR MOBILE -->
    <nav class="bottomNav" id="bottomNav">
      <button class="navItem" id="navLibrary" onclick="Logit.Utils.navTo('index.html')">
        <svg
          class="navIcon"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <rect x="3" y="3" width="7" height="7" rx="1.5" />
          <rect x="14" y="3" width="7" height="7" rx="1.5" />
          <rect x="3" y="14" width="7" height="7" rx="1.5" />
          <rect x="14" y="14" width="7" height="7" rx="1.5" />
        </svg>
        <span class="navLabel">Library</span>
      </button>

      <button class="navItem on" id="navPending" onclick="Logit.Utils.navTo('pending.html')">
        <svg
          class="navIcon"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <circle cx="12" cy="12" r="10" />
          <polyline points="12 6 12 12 16 14" />
        </svg>
        <span class="listBadge pendingBadge" data-badge="pending" style="display: none;"></span>
        <span class="navLabel">Pending</span>
      </button>

      <button
        class="navAdd"
        id="navAdd"
        aria-label="Add movie"
        onclick="window.location.href = Logit.Utils.getPageUrl('index.html') + '?add=true'"
      >
        <svg
          width="24"
          height="24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          viewBox="0 0 24 24"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
      </button>

      <button
        class="navItem"
        id="navStats"
        onclick="Logit.Utils.navTo('stats.html')"
      >
        <svg
          class="navIcon"
          width="22"
          height="22"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          viewBox="0 0 24 24"
        >
          <path d="M12 20V10" />
          <path d="M18 20V4" />
          <path d="M6 20v-4" />
        </svg>
        <span class="navLabel">Stats</span>
      </button>
    </nav>

    <!-- CHANGE TMDB MATCH MODAL -->
    <div class="matchModal" id="matchModal" role="dialog" aria-modal="true" aria-label="Change Movie Match">
      <div class="matchModalContent">
        <div class="matchModalHeader">
          <h3>Select Correct Movie</h3>
          <button class="clearBtn visible" id="closeMatchBtn" aria-label="Close">&times;</button>
        </div>
        <div class="matchModalBody">
          <input
            type="text"
            id="matchSearchInput"
            class="matchSearchInput"
            placeholder="Search movie title..."
            aria-label="Search movie"
          />
          <div class="matchResultsList" id="matchResultsList"></div>
        </div>
      </div>
    </div>

    <!-- SCRIPTS -->
    <script defer src="js/constants.js?v=59"></script>
    <script defer src="js/config.js?v=59"></script>
    <script defer src="js/utils.js?v=59"></script>
    <script defer src="js/movieFactory.js?v=59"></script>
    <script defer src="js/movies.js?v=59"></script>
    <script defer src="js/search.js?v=59"></script>
    <script defer src="js/supabase.js?v=59"></script>
    <script defer src="js/storage.js?v=59"></script>
    <script defer src="js/auth.js?v=59"></script>
    <script defer src="js/ui.js?v=59"></script>
    <script defer src="js/pending.js?v=59"></script>
    <script defer src="js/pendingPage.js?v=59"></script>
  </body>
</html>
